<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>خيارات الدخول | SFV-X Movies</title>

    <meta
        name="description"
        content="اختر طريقة الدخول إلى SFV-X Movies">

    <meta
        name="theme-color"
        content="#090909">

    <link
        rel="icon"
        href="../images/logo.png">

    <!-- Google Fonts -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Orbitron:wght@700;900&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- SFV-X Movie Entry CSS -->

    <link
        rel="stylesheet"
        href="movie-entry.css">

</head>

<body>

    <main class="entry-page">

        <div class="background-glow background-glow-one"></div>
        <div class="background-glow background-glow-two"></div>

        <section
            class="entry-card"
            aria-labelledby="entry-title">

            <div class="brand">

                <span class="brand-name">SFV-X</span>
                <span class="brand-section">MOVIES</span>

            </div>

            <div class="entry-content">

                <h1 id="entry-title">
                    تسجيل الدخول
                </h1>

                <p>
                    يمكنك تسجيل الدخول أو إنشاء حساب جديد
                    أو تخطي هذه الخطوة.
                </p>

            </div>

            <div class="entry-actions">

                <button
                    type="button"
                    class="entry-button login-button"
                    id="loginButton">

                    <i
                        class="fas fa-right-to-bracket"
                        aria-hidden="true">
                    </i>

                    <span>
                        تسجيل الدخول
                    </span>

                </button>

                <button
                    type="button"
                    class="entry-button register-button"
                    id="registerButton">

                    <i
                        class="fas fa-user-plus"
                        aria-hidden="true">
                    </i>

                    <span>
                        إنشاء حساب
                    </span>

                </button>

                <button
                    type="button"
                    class="skip-button"
                    id="skipButton">

                    تخطي الآن

                </button>

            </div>

        </section>

    </main>

    <!-- SFV-X Movie Entry JavaScript -->

    <script src="movie-entry.js"></script>

</body>

</html>
