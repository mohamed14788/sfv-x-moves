<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>اختيار التصنيف | SFV-X Movies</title>

    <meta
        name="description"
        content="اختر تصنيف المحتوى الذي تريد استكشافه في SFV-X Movies">

    <meta
        name="theme-color"
        content="#08080a">

    <link
        rel="icon"
        href="../images/logo.png">


    <!-- =====================================================
         GOOGLE FONTS
    ====================================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com">

    <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Orbitron:wght@700;900&display=swap">


    <!-- =====================================================
         SFV-X GENRES CSS
    ====================================================== -->

    <link
        rel="stylesheet"
        href="genres.css">

</head>


<body>


    <!-- =====================================================
         SFV-X GENRES PAGE
    ====================================================== -->

    <main class="genres-page">


        <!-- =================================================
             HEADER
        ================================================== -->

        <header class="genres-header">

            <div class="header-badge">
                SFV-X
            </div>

            <h1>
                اختر التصنيف
            </h1>

            <p>
                اختر النوع الذي تريد استكشافه
            </p>

        </header>


        <!-- =================================================
             GENRES GRID
        ================================================== -->

        <section
            class="genres-grid"
            aria-label="تصنيفات المحتوى">


            <!-- أكشن -->

            <button
                type="button"
                class="genre-card"
                data-genre="action"
                data-genre-name="أكشن">

                <span
                    class="genre-icon"
                    aria-hidden="true">
                    ⚔️
                </span>

                <span class="genre-name">
                    أكشن
                </span>

            </button>


            <!-- مغامرات -->

            <button
                type="button"
                class="genre-card"
                data-genre="adventure"
                data-genre-name="مغامرات">

                    class="genre-icon"
                    aria-hidden="true">
                    🗺️
                </span>

                    مغامرات
                </span>

            </button>


            <!-- كوميدي -->

            <button
                type="button"
                class="genre-card"
                data-genre="comedy"
                data-genre-name="كوميدي">

                <span
                    class="genre-icon"
                    aria-hidden="true">
                    😂
                </span>

                <span class="genre-name">
                    كوميدي
                </span>

            </button>


            <!-- رعب -->

            <button
                type="button"
                class="genre-card"
                data-genre="horror"
                data-genre-name="رعب">

                <span
                    class="genre-icon"
                    aria-hidden="true">
                    👻
                </span>

                <span class="genre-name">
                    رعب
                </span>

            </button>


            <!-- رومانسي -->

            <button
                type="button"
                class="genre-card"
                data-genre="romance"

                </span>

                    رومانسي
                </span>

            </button>


            <!-- إثارة -->

            <button
                type="button"
                class="genre-card"
                data-genre="thriller"
                data-genre-name="إثارة">

                <span
                    class="genre-icon"
                    aria-hidden="true">
                    🔪
                </span>

                <span class="genre-name">
                    إثارة
                </span>

            </button>


            <!-- غموض -->

            <button
                type="button"
                class="genre-card"
                data-genre="mystery"
                data-genre-name="غموض">

                <span
                    class="genre-icon"
                    aria-hidden="true">
                    🕵️
                </span>

                <span class="genre-name">
                    غموض
                </span>

            </button>


            <!-- خيال علمي -->

            <button
                type="button"
                class="genre-card"
                data-genre="science-fiction"
                data-genre-name="خيال علمي">

                <span
                    class="genre-icon"
                    aria-hidden="true">
                    🚀
                </span>

                <span class="genre-name">
                    خيال علمي
                </span>

            </button>


            <!-- فانتازيا -->

            <button
                type="button"
                class="genre-card"
                data-genre="fantasy"
                data-genre-name="فانتازيا">

                <span
                    class="genre-icon"
                    aria-hidden="true">
                    🧙
                </span>

                <span class="genre-name">

                </span>

            </button>


            <!-- دراما -->

            <button
                type="button"
                class="genre-card"
                data-genre="drama"

                    class="genre-icon"

                    🎭

                </span>

            </button>


            <!-- حرب -->

            <button
                type="button"
                class="genre-card"
                data-genre="war"
                data-genre-name="حرب">

                    class="genre-icon"
                    aria-hidden="true">
                    💥
                </span>

                <span class="genre-name">
                    حرب
                </span>

            </button>


            <!-- تاريخي -->

            <button
                type="button"
                class="genre-card"
                data-genre="history"
                data-genre-name="تاريخي">

                <span
                    class="genre-icon"
                    aria-hidden="true">
                    🏛️
                </span>

                <span class="genre-name">
                    تاريخي
                </span>

            </button>


        </section>


    </main>


    <!-- =====================================================
         SFV-X GENRES JAVASCRIPT
    ====================================================== -->

    <script src="genres.js"></script>

</body>

</html>
