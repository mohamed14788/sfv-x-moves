<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>اختيار القسم | SFV-X Movies</title>

    <meta
        name="description"
        content="اختر القسم الذي تريد استكشافه في SFV-X Movies">

    <meta
        name="theme-color"
        content="#090909">

    <link
        rel="icon"
        href="../images/logo.png">

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com">

    <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Orbitron:wght@700;900&display=swap">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <link
        rel="stylesheet"
        href="categories.css">

</head>


<body>

    <main class="categories-page">

        <header class="categories-header">

            <h1>
                اختر القسم
            </h1>

            <p>
                اختر القسم الذي تريد استكشافه
            </p>

        </header>


        <section
            class="categories-grid"
            aria-label="أقسام SFV-X Movies">


            <button
                type="button"
                class="category-card featured"
                id="moviesCategory">

                <div class="category-icon">
                    🎬
                </div>

                <span class="category-name">
                    أفلام
                </span>

            </button>


            <button
                type="button"
                class="category-card"
                id="seriesCategory">

                <div class="category-icon">
                    📺
                </div>

                <span class="category-name">
                    مسلسلات
                </span>

            </button>


            <button
                type="button"
                class="category-card"
                id="animeCategory">

                <div class="category-icon">
                    🇯🇵
                </div>

                <span class="category-name">
                    أنمي
                </span>

            </button>


            <button
                type="button"
                class="category-card"
                id="dilingoCategory">

                <div class="category-icon">
                    🇨🇳
                </div>

                <span class="category-name">
                    ديلينغو
                </span>

            </button>


            <button
                type="button"
                class="category-card"
                id="cartoonsCategory">

                <div class="category-icon">
                    🧸
                </div>

                <span class="category-name">
                    كرتون وأنيميشن
                </span>

            </button>


            <button
                type="button"
                class="category-card"
                id="summariesCategory">

                <div class="category-icon">
                    🎞️
                </div>

                <span class="category-name">
                    ملخصات أفلام
                </span>

            </button>


        </section>

    </main>


    <script src="categories.js"></script>

</body>

</html>
